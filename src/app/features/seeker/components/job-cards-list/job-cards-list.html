<div class="grid grid-cols-3 gap-6">
  <div *ngFor="let job of [0,1,2,3,4,5,6,7,8]" class="p-6 border rounded-lg border-input-border hover:shadow-lg hover:scale-[1.01] hover:border-primary hover:cursor-pointer group" routerLink="/jobs/1">
    <div class="flex flex-row justify-start gap-4 mb-5 items-around">
      <figure>
        <img src="/assets/images/reddit.png" alt="">
      </figure>
      <div class="flex flex-col justify-around">
        <h3 class="font-semibold text-md">Reddit <span class="px-4 py-0.5 text-xs text-red-300 bg-red-50 rounded-full ml-6">En vedette</span></h3>
        <p class="text-sm text-gray">
          <i class="pi pi-map-marker mr-0.5"></i> 
          Royaume-Uni de Grande-Bretagne
        </p>
      </div>
    </div>
    <div>
      <h2 class="mb-2 text-lg font-semibold group-hover:text-primary">Responsable marketing</h2>
      <div class="flex flex-row justify-between text-sm text-zinc-500">
        <p>Temps plein * 30k$-35k$</p>
        <p>
          <i class="pi pi-calendar mr-0.5"></i>
          4 jours restants
        </p>
      </div>
    </div>
  </div>
</div>

<div class="p-6 rounded-lg shadow bg-secondary testimony">
  <div class="mb-4">
      <p-rating [(ngModel)]="testimonial.rating" [disabled]="true"/>
  </div>
  <p class="text-sm lg:h-32 text-gray"><< {{ testimonial.comment }} >></p>
  <div class="relative flex flex-row items-center justify-start gap-4 mt-3 mb-2 lg:mt-0">
    <!-- <img class="rounded-full size-10" src="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"> -->
    <div class="flex flex-row items-center justify-center font-semibold text-white rounded-full size-10 bg-primary">{{ userInitials | uppercase }}</div>
    <div>
      <h3 class="font-semibold">{{ testimonial.author | titlecase }}</h3>
      <p class="text-sm text-gray">Utilisateur</p>
    </div>
    <img class="absolute right-2 -bottom-1" src="assets/icons/quote.png" alt="">
  </div>
</div>

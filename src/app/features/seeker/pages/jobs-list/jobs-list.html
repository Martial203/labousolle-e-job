<div>
  <div class="bg-light-blue">
    <div class="container px-16 py-8 mx-auto">
      <app-search-bar (onFilterRequested)="onShowFilterModal()"></app-search-bar>
    </div>
  </div>
  
  <section class="container px-16 py-12 mx-auto">
    <div class="mb-16">
      <app-job-cards-list></app-job-cards-list>
    </div>

    <div class="flex flex-row items-center justify-center gap-4 mb-8 text-sm">
      <button class="mr-2 rounded-full bg-light-blue px-3 py-2.5"><i class="pi pi-arrow-left text-primary"></i></button>
      <span *ngFor="let i of [1,2,3,4,5]" class="flex hover:shadow flex-row cursor-pointer items-center justify-center rounded-full size-10 {{ i===1 ? 'bg-primary text-secondary hover:brightness-110' : 'hover:bg-gray'}}">{{ i | number:'2.0-0' }}</span>
      <button class="px-3 ml-2 rounded-full py-2.5 hover:bg-light-blue"><i class="pi pi-arrow-right text-primary"></i></button>
    </div>
  </section>

  <p-dialog [modal]="true" [(visible)]="isFilterModalOpen" [style]="{ width: 'auto', background: '#ffffff' }">
    <div class="px-6 pt-2 pb-6 shadow-xl rounded-l6">
      <app-advanced-filter></app-advanced-filter>
    </div>
  </p-dialog>

  
  
</div>

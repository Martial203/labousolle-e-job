<form #search="ngForm" class="container flex flex-col gap-3 p-4 pl-5 mb-4 rounded shadow ld:divide-x lg:flex-row divide-divide-color bg-secondary">
  <div class="flex-1 whitespace-nowrap">
    <i class="mr-4 text-primary pi pi-search"></i>
    <input class="h-full border-none outline-none" type="text" name="title" id="title" placeholder="Titre du poste, Mot-clé, ..." ngModel>
  </div>
  <div class="flex-1 lg:pl-8 whitespace-nowrap">
    <i class="mr-4 text-primary pi pi-map-marker"></i>
    <input class="h-full border-none outline-none" type="text" name="location" id="location" placeholder="Emplacement" ngModel>
  </div>
  <div class="flex-1 lg:pl-8 whitespace-nowrap">
    <i class="mr-4 text-primary pi pi-map-marker"></i>
    <input class="h-full border-none outline-none" type="text" name="category" id="category" placeholder="Sélectionner une catégorie" ngModel>
  </div>
  <div class="flex flex-row items-center flex-1 mr-4 ld:pl-8 whitespace-nowrap">
    <button class="block h-full {{ filtering ? 'text-primary' : '' }}" (click)="onShowFilterModal()">Filtre avancé  <i class="ml-2 align-middle pi {{ filtering ? 'pi-chevron-up' : 'pi-chevron-down' }} "></i></button>
  </div>
  <p-button class="mt-2 mr-1 text-white border-none rounded lg:mt-0 whitespace-nowrap" severity="info" (click)="onSubmit(search.value)">Trouver un emploi</p-button>
</form>

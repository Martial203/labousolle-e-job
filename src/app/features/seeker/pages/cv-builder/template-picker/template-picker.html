<div>
  <div class="mx-auto">
    <!-- Header -->
    <div class="mb-12">
      <h1 class="mb-2 text-4xl font-bold">Choisissez votre modèle</h1>
      <p class="text-slate-400">Sélectionnez un design qui vous correspond</p>
    </div>

    <!-- CV/Motivation Letter Selector -->
    <div class="flex flex-row gap-3 mb-10">
      <button 
        pButton
        type="button" 
        label="CV" 
        (click)="selectedType = DOCUMENT_TYPES.CV"
        [severity]="selectedTemplate===DOCUMENT_TYPES.CV ? 'info' : 'secondary'"
        class="block flex-1 px-8 py-3 font-semibold transition-all duration-300 rounded-lg {{ selectedType == DOCUMENT_TYPES.CV ? 'selected' : ''}}" [outlined]="selectedType!==DOCUMENT_TYPES.CV" [icon]="selectedType==DOCUMENT_TYPES.CV ? 'pi pi-check' : ''">
      </button>
      <button 
        pButton
        type="button" 
        label="Lettre de Motivation" 
        (click)="selectedType = DOCUMENT_TYPES.LETTER"
        [severity]="selectedTemplate===DOCUMENT_TYPES.LETTER ? 'info' : 'secondary'"
        class="block flex-1 px-8 py-3 font-semibold transition-all duration-300 rounded-lg {{ selectedType == DOCUMENT_TYPES.LETTER ? 'selected' : ''}}" [outlined]="selectedType!==DOCUMENT_TYPES.LETTER" [icon]="selectedType==DOCUMENT_TYPES.LETTER ? 'pi pi-check' : ''">
      </button>
    </div>

    <!-- Templates Grid -->
    <div class="flex flex-row justify-start w-full gap-6 px-2.5 pt-4 pb-4 overflow-x-auto templates">
      <ng-container *ngFor="let template of getTemplates()|async">
        <div (click)="selectTemplate(template)" class="relative cursor-pointer hover:scale-105 w-72 hover:brightness-105 hover:border-primary hover:border-[0.5px] {{ selectedTemplate===template ? 'shadow-2xl scale-[1.03] border-primary border-[0.5px] rounded-t-xl' : '' }}">
          <div class="relative overflow-hidden transition-transform duration-300 rounded-xl">
            <img [src]="template.previewImage" [alt]="template.name" onerror="this.src='/assets/images/home-banner.png'" class="object-cover w-full transition-all duration-300 max-h-60">
            <div class="p-5">
              <h3 class="mb-2 text-lg font-semibold text-slate-600">{{ template.name }}</h3>
              <p class="text-sm text-slate-400">{{ template.description }}</p>
            </div>
          </div>
        </div>
      </ng-container>
    </div>

    <div class="mt-6">
      <p-message *ngIf="processState===PROCESS_STATES.SUCCESS" severity="success" text="Conversation initialisée avec succès!" class="w-full mb-4"></p-message>
      <p-message *ngIf="processState===PROCESS_STATES.ERROR" severity="error" text="Une erreur est survenue lors de l'initialisation de la conversation. Veuillez ressayer." class="w-full mb-4"></p-message>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-center gap-4 mt-6">
      <button 
        pButton
        severity="secondary" 
        type="button" 
        label="Annuler" 
        (click)="onCancel()"
        class="px-8 py-3 font-semibold transition-all duration-300 rounded-lg w-52 bg-slate-700 text-slate-300 hover:bg-slate-600">
      </button>
      <button 
        pButton 
        severity="info"
        type="button" 
        label="Sélectionner" 
        (click)="onSubmit()"
        [loading]="processState===PROCESS_STATES.LOADING"
        [disabled]="!selectedTemplate || !selectedType"
        class="px-8 py-3 font-semibold text-white transition-all duration-300 rounded-lg w-52 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 disabled:opacity-50 disabled:cursor-not-allowed">
      </button>
    </div>
  </div>
</div>

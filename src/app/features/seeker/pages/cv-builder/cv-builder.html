<div class="container flex flex-row w-full h-full px-16 mx-auto">
  <aside class="w-[30em]">
    <app-chat-history></app-chat-history>
  </aside>
  <section class="w-full px-6">
    <header class="w-full">
      <div class="flex flex-row justify-between p-4 mx-auto shadow-md">
        <div class="flex flex-row items-center justify-between gap-8">
          <figure class="overflow-hidden rounded-full w-26"><img class="object-cover w-full" src="/assets/images/reddit.png" alt=""></figure>
          <h1>SAMBA</h1>
        </div>
        <p-avatar image="/assets/images/reddit.png" shape="circle" size="normal"></p-avatar>
      </div>
    </header>
    <main class="flex flex-col gap-16 px-8 py-12">
      <div class="flex-1 overflow-y-auto">
        <app-discussion></app-discussion>
      </div>
      <div class="flex flex-row items-center w-full h-20 gap-4 pl-4 overflow-hidden border rounded-3xl h-fit">
        <p-button icon="pi pi-link" class="block"></p-button>
        <textarea class="flex-1 py-1 bg-transparent border-none outline-none" rows="1"  name="" id=""></textarea>
        <div class="flex flex-row items-center gap-4 p-2">
          <button class="block" class="p-2 px-3 bg-transparent rounded-full text-primary"><i class="scale-[1.4] pi pi-microphone"></i></button>
          <button class="block" class="p-2 px-3 rounded-full bg-primary text-secondary"> <i class="pi pi-arrow-up"></i></button>
        </div>
      </div>
    </main>
  </section>
</div>

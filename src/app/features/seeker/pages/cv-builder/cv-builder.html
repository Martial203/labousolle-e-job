<div class="container flex flex-row w-full h-full px-16 pb-10 mx-auto">
  <aside class="w-[30em] h-[calc(100vh-11em)] overflow-auto pb-6">
    <app-chat-history (newChat)="displayTemplatePicker = true" (delete)="deleteChat($event)" (select)="selectChat($event)"></app-chat-history>
  </aside>
  <section class="w-full px-6 overflow-auto">
    <div class="h-[calc(100vh-15em)] overflow-y-auto mb-2">
      <header class="w-full">
        <p-toolbar class="mx-auto shadow-md ">
          <ng-template #start>
            <div class="flex flex-row items-center justify-between gap-8 ml-1">
              <figure class="overflow-hidden rounded-full w-26"><img class="object-cover w-full" src="/assets/images/reddit.png" alt=""></figure>
              <h1 class="font-semibold">SAMBA</h1>
            </div>
          </ng-template>
          <ng-template #end>
            <p-avatar image="/assets/images/reddit.png" shape="circle" size="normal" class="mr-1"></p-avatar>
          </ng-template>
        </p-toolbar>
      </header>
      <main class="flex flex-col gap-16 px-8 py-12">
        <div class="flex-1 overflow-y-auto">
          <app-discussion></app-discussion>
        </div>
      </main>
    </div>
    <div>
      <app-chat-message-input></app-chat-message-input>
    </div>
  </section>
</div>

<p-dialog [(visible)]="displayTemplatePicker" header="Assistance AI" [modal]="true" [closable]="true">
  <app-template-picker [selectedType]="documentType" (cancel)="displayTemplatePicker=false"></app-template-picker>
</p-dialog>

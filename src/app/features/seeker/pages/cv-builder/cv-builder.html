<div class="container flex flex-row w-full h-full px-6 pb-10 mx-auto lg:px-16">
  <ng-container *ngIf="chatHistory$|async as chatHistory">
    <aside class="w-[30em] h-[calc(100vh-11em)] overflow-auto pb-6 hidden lg:block">
      <app-chat-history [chatHistory]="groupChatsByDate(chatHistory)" (newChat)="displayTemplatePicker = true" (delete)="deleteChat($event)" (select)="selectChat($event)"></app-chat-history>
    </aside>
    <p-drawer [(visible)]="displayChatHistory" header=" ">
      <app-chat-history [chatHistory]="groupChatsByDate(chatHistory)" (newChat)="displayTemplatePicker = true" (delete)="deleteChat($event)" (select)="selectChat($event)"></app-chat-history>
    </p-drawer>
  </ng-container>
  <section class="w-full px-2 overflow-auto lg:px-6">
    <div class="h-[calc(100vh-15em)] overflow-y-auto mb-2">
      <header class="w-full">
        <p-toolbar class="mx-auto shadow-md ">
          <ng-template #start>
            <p-button icon="pi pi-comments" severity="info" [rounded]="true" class="block mr-2 lg:hidden" (click)="onToggleChatHistory()"></p-button>
            <div class="flex flex-row items-center justify-between gap-8 ml-1">
              <figure class="hidden overflow-hidden rounded-full w-26 lg:block"><img class="object-cover w-full" src="assets/images/reddit.png" alt=""></figure>
              <h1 class="font-semibold capitalize">{{ user.name }}</h1>
            </div>
          </ng-template>
          <ng-template #end>
            <p-avatar image="assets/images/reddit.png" shape="circle" size="normal" class="mr-1"></p-avatar>
          </ng-template>
        </p-toolbar>
      </header>
      <main class="flex flex-col gap-16 px-4 py-12 lg:px-8">
        <div #scrollContainer class="flex-1 overflow-y-auto">
          <ng-container *ngIf="selectedDiscussion; else noSelectedDiscussion">
            <app-discussion [typingState]="messageProcessing" [loadingMessages]="processState===PROCESS_STATES.LOADING" [messages]="(discussion$|async)!"></app-discussion>
          </ng-container>
          <ng-template #noSelectedDiscussion>
            <div class="flex flex-col items-center justify-center gap-6 h-96">
              <div class="p-2 bg-gray-100 rounded-full">
                <i class="block scale-[2] text-gray pi pi-inbox"></i>
              </div>
              <div class="text-center">
              <p class="mb-2 text-xl font-bold text-gray">Aucune discussion sélectionnée</p>
              <p class="text-sm text-gray">Sélectionnez une discussion pour découvrir les messages</p>
              </div>
              <button pButton label="Démarrer une discussion" icon="pi pi-plus" severity="info" class="mt-4" (click)="displayTemplatePicker = true"></button>
            </div>
          </ng-template>
        </div>
      </main>
    </div>
    <div>
      <app-chat-message-input (message)="sendMessage($event)"></app-chat-message-input>
    </div>
  </section>
</div>

<p-dialog [(visible)]="displayTemplatePicker" header="Assistance AI" [modal]="true" [closable]="true" styleClass="w-[90%] lg:!w-1/2">
  <app-template-picker [selectedType]="documentType" (cancel)="displayTemplatePicker=false" (result)="displayTemplatePicker=false"></app-template-picker>
</p-dialog>

<div class="flex flex-col gap-6 pb-4">
  <div *ngFor="let message of messages" class="flex flex-row message w-[98%] lg:w-[90%] {{ message.sender==='user' ? 'me' : '' }}">
    <div class="w-32 mr-2">
      <p-avatar image="/assets/images/reddit.png" shape="circle" size="normal"></p-avatar>
    </div>
    <div>
      <p class="mb-2">
        <strong>{{ message.sender==='user' ? 'You' : 'Assistant' }}</strong>
        <span class="ml-2 text-sm text-gray"> {{ message.date | date }}</span>
      </p>
      <div class="p-4 leading-relaxed whitespace-pre-line rounded-2xl content text-secondary" [innerHTML]="message.content"></div>
      <ng-container *ngIf="message.document as attachment">
        <figure class="relative flex flex-row items-center justify-center mt-4 overflow-hidden w-80 h-60 rounded-2xl content">
          <img class="object-cover w-full" src="/assets/images/home-banner.png" alt="">
          <div class="absolute bottom-0 flex flex-row justify-around w-full py-4 bg-primary">
            <button pButton severity="info" (click)="previewDocument(attachment.url)">Prévisualiser</button>
            <a pButton severity="secondary" download [loading]="processState === PROCESS_STATES.LOADING" (click)="download(attachment.url)">Télécharger</a>
          </div>
        </figure>
      </ng-container>
    </div>
  </div>
  <ng-container *ngIf="typingState===PROCESS_STATES.LOADING">
    <div class="inline-flex items-center gap-1 px-3 py-2 mt-2 ml-10 rounded-full shadow-sm bg-primary/15 w-fit">
      <span class="w-2.5 h-2.5 bg-primary rounded-full animate-ping"></span>
      <span class="w-2.5 h-2.5 bg-primary rounded-full animate-ping delay-200"></span>
      <span class="w-2.5 h-2.5 bg-primary rounded-full animate-ping delay-400"></span>
    </div>
  </ng-container>
  <ng-container *ngIf="typingState===PROCESS_STATES.ERROR">
    <p-message severity="error" text="L'envoi de message a échoué, veuillez ressayer." class="w-full mb-4"></p-message>
  </ng-container>
</div>

<p-dialog header="Prévisualisation du document" [modal]="true" [(visible)]="displayDocumentPreview" [maximizable]="true">
  <p *ngIf="processState===PROCESS_STATES.LOADING" class="text-2xl text-center text-primary"><i class="pi pi-spinner animate-spin"></i></p>
  <pdf-viewer #pdfViewer
    [src]="pdfSrc"
    [render-text]="false"
    [original-size]="false"
    class="w-[60vh] h-[80vh] border-4"
  ></pdf-viewer>
  <p-message *ngIf="processState===PROCESS_STATES.ERROR" severity="error" text="Erreur de chargement du documment. Veuillez ressayer." class="w-full mb-4"></p-message>

  <ng-template #footer>
    <p-button label="Fermer" [text]="true" severity="secondary" (click)="displayDocumentPreview = false" />
    <p-button label="Télécharger" [outlined]="true" severity="secondary" [disabled]="processState===PROCESS_STATES.LOADING" [loading]="processState===PROCESS_STATES.LOADING" (click)="download(pdfSrc)" />
  </ng-template>
</p-dialog>

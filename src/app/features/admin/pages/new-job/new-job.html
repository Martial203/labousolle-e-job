<form class="flex flex-col gap-6 px-6 pb-16">
  <h1 class="text-2xl font-semibold">Publier une offre d'emploi</h1>
  <div class="flex flex-col gap-4">
    <div>
      <label for="">Intitulé du poste</label>
      <input pInputText placeholder="Ajoutez l'intitulé du poste, le rôle, le nombre de postes, etc." type="text">
    </div>
    <!-- <div>
      <label for="">Tags</label>
      <input pInputText placeholder="Mots-clés du poste, tags, etc..." type="text">
    </div> -->
    <div>
      <label for="">Adresse mail pour postuler</label>
      <input pInputText placeholder="contact@gmail.com" type="email">
    </div>
    <!-- <div>
      <h2>Salaire</h2>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="">Salaire minimum</label>
          <p-inputgroup>
            <p-input-number class="border-none" placeholder="Salaire minimum..." />
            <p-inputgroup-addon>FCFA</p-inputgroup-addon>
          </p-inputgroup>
        </div>
        <div>
          <label for="">Salaire maximum</label>
          <p-inputgroup>
            <p-input-number class="border-none" placeholder="Salaire maximun..." />
            <p-inputgroup-addon>FCFA</p-inputgroup-addon>
          </p-inputgroup>
        </div>
      </div>
    </div> -->
    <div>
      <h2>Informations avancées</h2>
      <div class="grid grid-cols-2 gap-4">
        <!-- <div>
          <label for="">Éducation</label>
          <p-select placeholder="Sélectionner"></p-select>
        </div> -->
        <div>
          <label for="">Expérience</label>
          <p-select placeholder="Sélectionner" [options]="experiences"></p-select>
        </div>
        <div>
          <label for="">Type de poste</label>
          <p-select placeholder="Sélectionner" [options]="contractTypes"></p-select>
        </div>
        <!-- <div>
          <label for="">Postes disponibles</label>
          <p-select placeholder="Sélectionner"></p-select>
        </div> -->
        <div>
          <label for="">Date d'expiration</label>
          <p-datepicker inputStyleClass="w-full" placeholder="JJ/MM/AAAA"></p-datepicker>
        </div>
        <!-- <div>
          <label for="">Niveau du poste</label>
          <p-select placeholder="Sélectionner"></p-select>
        </div> -->
        <div>
          <label for="">Lieu</label>
          <input pInputText type="text" placeholder="Douala, Cameroun" autocomplete="address-line1">
        </div>
      </div>
    </div>
    <div>
      <h2>Description et responsabilités</h2>
      <div class="mb-4">
        <label for="">Description</label>
        <p-editor name="description" placeholder="Ajoutez votre description de poste..." ngModel [style]="{ height: '180px' }" />
      </div>
      <div>
        <label for="">Responsabilités</label>
        <p-editor name="responsibilities" placeholder="Ajoutez vos responsabilités..." ngModel [style]="{ height: '180px' }" />
      </div>
    </div>
  </div>
  <button pButton class="w-fit" severity="info" label="Publier l'offre d'emploi" icon="pi pi-arrow-right" iconPos="right"></button>
</form>

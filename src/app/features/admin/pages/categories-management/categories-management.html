<div class="p-8">
  <div class="flex flex-row items-center justify-between">
    <div class="mb-8">
      <h1 class="text-4xl font-bold text-gray-900">Categories</h1>
      <p class="mt-2 text-gray-600">Manage your product categories</p>
    </div>

    <div class="mb-6">
      <button (click)="openModal()" class="px-6 py-3 font-medium text-white transition-colors bg-blue-600 rounded-lg shadow-md hover:bg-blue-700">
        + Add Category
      </button>
    </div>
  </div>

  <div class="overflow-hidden rounded-lg">
    <p-table [value]="[0,1,2,3,4,5,6]" [tableStyle]="{ 'width': '100%' }" responsiveLayout="scroll">
      <ng-template #header>
        <tr class="border-b bg-gray-50">
          <th class="px-6 py-4 text-sm font-semibold text-left text-gray-700">Code</th>
          <th class="px-6 py-4 text-sm font-semibold text-left text-gray-700">Name</th>
          <th class="px-6 py-4 text-sm font-semibold text-left text-gray-700">Category</th>
          <th class="px-6 py-4 text-sm font-semibold text-left text-gray-700">Quantity</th>
        </tr>
      </ng-template>
      <ng-template #body let-product>
        <tr class="transition-colors border-b hover:bg-gray-50">
          <td class="px-6 py-4 text-sm text-gray-900">0</td>
          <td class="px-6 py-4 text-sm text-gray-900">0</td>
          <td class="px-6 py-4 text-sm text-gray-900">0</td>
          <td class="px-6 py-4 text-sm text-gray-900">0</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog 
  [(visible)]="displayModal" 
  [modal]="true" 
  [header]="'Manage Categories'"
  [style]="{'width': '50vw'}"
  [breakpoints]="{'960px': '75vw', '640px': '90vw'}"
  [draggable]="false"
  [resizable]="false"
  styleClass="p-dialog-modern">
  
  <app-category-form></app-category-form>

  <ng-template pTemplate="footer">
    <button pButton label="Cancel" (click)="displayModal=false" class="mr-2 p-button-text"></button>
    <button pButton label="Save" (click)="saveCategory()" class="p-button-success"></button>
  </ng-template>
</p-dialog>

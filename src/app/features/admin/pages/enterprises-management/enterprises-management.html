<div class="w-full h-full p-8 bg-gray-50">
  <div class="flex items-center justify-between mb-8">
    <h1 class="text-3xl font-bold text-gray-900">Entreprises</h1>
    <p-button 
      label="Add" 
      icon="pi pi-plus"
      class="p-button-primary"
      severity="info"
      routerLink="/admin/enterprises/new">
    </p-button>
  </div>

  <p-table 
    *ngIf="companies$|async as companies"
    [value]="companies"
    [paginator]="true"
    [rows]="10"
    [scrollable]="true"
    scrollHeight="500px"
    responsiveLayout="scroll"
    styleClass="p-datatable-striped">
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="name" class="bg-white">Nom <p-sortIcon field="name"></p-sortIcon></th>
        <th pSortableColumn="type" class="bg-white">Type <p-sortIcon field="type"></p-sortIcon></th>
        <th pSortableColumn="offers" class="bg-white">Postes ouverts <p-sortIcon field="offers"></p-sortIcon></th>
        <th class="text-center bg-white">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-enterprise>
      <tr>
        <td class="font-medium">{{ enterprise.name }}</td>
        <td>{{ enterprise.type | titlecase }}</td>
        <td>{{ enterprise.offers | number }}</td>
        <td>
          <div class="flex gap-2">
            <button 
              pButton
              icon="pi pi-eye" 
              [rounded]="true" 
              [text]="true"
              severity="info"
              pTooltip="Details"
              tooltipPosition="top"
              routerLink="/admin/enterprises/new/{{enterprise.id}}"
              [queryParams]="{ mode: 'view' }">
            </button>
            <button 
              pButton
              icon="pi pi-pencil" 
              [rounded]="true" 
              [text]="true"
              severity="warn"
              pTooltip="Edit"
              tooltipPosition="top"
              routerLink="/admin/enterprises/new/{{enterprise.id}}">
            </button>
            <button 
              pButton
              icon="pi pi-trash" 
              [rounded]="true" 
              [text]="true"
              severity="danger"
              pTooltip="Delete"
              tooltipPosition="top"
              (click)="confirmDeletion(enterprise.id)"
              >
            </button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-toast />

<div class="w-full h-full p-8 bg-gray-50">
  <div class="flex items-center justify-between mb-8">
    <h1 class="text-3xl font-bold text-gray-900">Entreprises</h1>
    <p-button 
      label="Add" 
      icon="pi pi-plus"
      class="p-button-primary"
      severity="info"
      routerLink="/admin/enterprises/new">
    </p-button>
  </div>

  <p-table 
    *ngIf="companies$|async as companies"
    [value]="mapToCompanyRow(companies)"
    [rows]="10"
    responsiveLayout="scroll"
    styleClass="p-datatable-striped">
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="name" class="bg-white">Name <p-sortIcon field="name"></p-sortIcon></th>
        <th pSortableColumn="email" class="bg-white">Email <p-sortIcon field="email"></p-sortIcon></th>
        <th pSortableColumn="phone" class="bg-white">Phone <p-sortIcon field="phone"></p-sortIcon></th>
        <th class="bg-white">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-enterprise>
      <tr>
        <td class="font-medium">{{ enterprise.name }}</td>
        <td>{{ enterprise.email }}</td>
        <td>{{ enterprise.phone }}</td>
        <td>
          <div class="flex gap-2">
            <p-button 
              icon="pi pi-eye" 
              [rounded]="true" 
              [text]="true"
              severity="info"
              pTooltip="Details"
              tooltipPosition="top">
            </p-button>
            <p-button 
              icon="pi pi-pencil" 
              [rounded]="true" 
              [text]="true"
              severity="warn"
              pTooltip="Edit"
              tooltipPosition="top">
            </p-button>
            <p-button 
              icon="pi pi-trash" 
              [rounded]="true" 
              [text]="true"
              severity="danger"
              pTooltip="Delete"
              tooltipPosition="top"
              (click)="confirmDeletion($event, enterprise.id)"
              >
            </p-button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-toast />
<p-confirmdialog />

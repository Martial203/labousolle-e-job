<form class="flex flex-col gap-4">
  <h1 class="text-xl font-semibold">Liens réseaux sociaux</h1>
  <div class="flex flex-col gap-4">
    <div *ngFor="let socialNetwork of networks; let i=index">
      <label class="block mb-2 text-sm font-semibold" for="">Lien social {{ i + 1 }}</label>
      <div class="flex flex-row items-center justify-between gap-4">
        <p-inputgroup>
          <p-inputgroup-addon>
            <p-select [options]="socialNetworks" class="p-0 m-0" placeholder="Select a City"/>
          </p-inputgroup-addon>
          <input pInputText class="pl-4" type="text" id="{{socialNetwork}}" [name]="socialNetwork" placeholder="Lien vers la page facebook de l'entreprise">
        </p-inputgroup>
        <button pButton class="scale-[1.2]" icon="pi pi-times-circle" severity="secondary" size="large" (click)="removeAField(socialNetwork)"></button>
      </div>
    </div>
  </div>
  <div class="mt-4">
    <!-- <button class="block w-full py-2 text-center rounded text-secondary bg-primary" (click)="addAField()"><i class="mr-2 align-middle pi pi-plus-circle"></i>Ajouter un nouveau lien social</button> -->
    <button pButton class="block w-full" severity="info" label="Ajouter un nouveau lien social" icon="pi pi-plus-circle" (click)="addAField()"></button>
  </div>
  <div class="flex flex-row gap-4">
    <button pButton severity="secondary" label="Précédent"></button>
    <button pButton severity="info" label="Enregistrer et suivant"></button>
  </div>
</form>

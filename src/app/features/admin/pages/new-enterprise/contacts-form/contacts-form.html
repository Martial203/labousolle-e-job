<form class="flex flex-col gap-4 p-8">
  <div>
    <label for="">Emplacement sur la carte</label>
    <p-inputgroup>
      <p-inputgroup-addon>
        <i class="pi pi-map-marker"></i>
      </p-inputgroup-addon>
      <input pInputText name="address" autocomplete="address-level1" type="text" placeholder="Adresse">
    </p-inputgroup>
  </div>
  <div>
    <label for="">Téléphone</label>
    <p-inputgroup>
      <p-inputgroup-addon>
          <i class="pi pi-phone"></i>
      </p-inputgroup-addon>
      <input pInputText name="phone" type="tel" autocomplete="tel" placeholder="Numéro de téléphone" />
    </p-inputgroup>
  </div>
  <div>
    <label for="">Email</label>
    <p-inputgroup>
      <p-inputgroup-addon>
          <i class="pi pi-envelope"></i>
      </p-inputgroup-addon>
      <input pInputText name="email" type="email" autocomplete="email" placeholder="Adresse e-mail" />
    </p-inputgroup>
  </div>

  <div class="flex flex-row gap-4 mt-4">
    <button pButton severity="secondary" label="Précédent"></button>
    <button pButton severity="info" label="Terminer l'édition" icon="pi pi-arrow-right" iconPos="right"></button>
  </div>
</form>

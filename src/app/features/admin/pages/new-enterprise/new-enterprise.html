<p-tabs [(value)]="tab">
    <p-tablist>
        <p-tab [value]="0"><i class="pi pi-user"></i> Informations sur l'entreprise</p-tab>
        <p-tab [value]="1"><i class="pi pi-globe"></i> Profil des réseaux sociaux</p-tab>
        <p-tab [value]="2"><i class="pi">@</i> Contact</p-tab>
    </p-tablist>
    <p-tabpanels> 
        <p-tabpanel [value]="0">
            <div class="m-0">
                <app-general-infos-form [company]="company" [editMode]="editMode" (value)="onValidateStep($event)"></app-general-infos-form>
            </div>
        </p-tabpanel>
        <p-tabpanel [value]="1">
            <div class="m-0">
                <app-social-networks-form [company]="company" [editMode]="editMode" (value)="onValidateStep($event)" (back)="tab=0"></app-social-networks-form>
            </div>
        </p-tabpanel>
        <p-tabpanel [value]="2">
            <div class="m-0">
                <app-contacts-form [company]="company" [editMode]="editMode" (value)="onValidateStep($event)" (back)="tab=1"></app-contacts-form>
            </div>
        </p-tabpanel>
    </p-tabpanels>
</p-tabs>

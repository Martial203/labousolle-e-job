<form class="flex flex-col gap-4">
  <h1 class="text-lg font-semibold">Logo et image de bannière</h1>
  <div>
    <div class="flex flex-row">
      <label for="">Télécharger le logo</label>
      <button *ngIf="selectedFile" pButton class="relative z-10 top-6 left-16 scale-[70%]" icon="pi pi-times" [rounded]="true" [text]="false" severity="danger" (click)="onResetLogo()"></button>
    </div>
    <figure pRipple class="relative flex flex-row items-center justify-center w-56 h-56 overflow-hidden text-center border border-dashed rounded-md cursor-pointer ripple-box border-input-border hover:shadow-lg hover:bg-input-background" (click)="logoInputField.click()">
      <ng-container *ngIf="selectedFile; else placeholder">
        <img class="object-cover w-full h-full" [src]="preview" alt="">
        <!-- <button pButton class="absolute top-0 right-0" icon="pi pi-times"></button> -->
      </ng-container>
      <ng-template #placeholder>
        <div class="flex flex-col gap-2 px-4 py-8">
          <div><i class="block text-primary pi pi-cloud-upload" style="font-size: 2.5rem"></i></div>
          <p class="text-sm font-semibold">Parcourir une photo ou déposer en une ici</p>
          <p class="text-xs text-primary">Une photo de plus de 400 pixels fonctionne mieux. Taille maximale de la photo 5 Mo.</p>
        </div>
      </ng-template>
    </figure>
    <input #logoInputField type="file" class="hidden" accept=".jpg, .png, .jpeg, .gif" (change)="onLogoSelected($event)">
  </div>
  <div class="grid grid-cols-2 gap-4">
    <div>
      <label for="">Nom de l'entreprise</label>
      <input pInputText type="text" name="name" id="">
    </div>
    <div>
      <label for="">Type d'organisation</label>
      <p-select type="text" name="type" id=""></p-select>
    </div>
    <div>
      <label for="">Taille de l'équipe</label>
      <p-select type="text" name="size" id=""></p-select>
    </div>
    <div>
      <label for="">Date de création</label>
      <p-datepicker inputStyleClass="w-full" name="creationDate"></p-datepicker>
    </div>
    <div>
      <label for="">Site web de l'entreprise</label>
      <input pInputText type="url" name="website" id="">
    </div>
    <div>
      <label for="">Adresse</label>
      <input pInputText type="text" name="address" id="">
    </div>
  </div>
  <div>
    <label for="">A propos de nous</label>
    <p-editor name="about" placeholder="Écrivez ici les informations sur votre entreprise. Faites savoir au candidat qui nous sommes..." ngModel [style]="{ height: '180px' }" />
  </div>
  <div>
    <label for="">Vision de l'entreprise</label>
    <p-editor name="vision" placeholder="Parlez-nous de la vision de votre entreprise..." ngModel [style]="{ height: '180px' }" />
  </div>
  <!-- <button class="px-6 py-3 rounded text-secondary bg-primary">Enregistrer et suivant <i class="ml-2 align-middle pi pi-arrow-right"></i></button> -->
  <button pButton severity="info" class="mt-6" label="Enregistrer et suivant" icon="pi pi-arrow-right" iconPos="right"></button>

</form>

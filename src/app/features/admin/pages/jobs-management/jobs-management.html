<div class="jobs-management-container">
  <div class="flex flex-row justify-between header">
    <h1 class="text-xl font-semibold">Jobs Management</h1>
    <button pButton type="button" routerLink="/admin/jobs/new" label="Add Job" icon="pi pi-plus" class="p-button-success"></button>
  </div>

  <p-table
    #dt
    [value]="jobs"
    [paginator]="true"
    [rows]="10"
    responsiveLayout="scroll"
    [tableStyle]="{ 'min-width': '50rem' }"
    [globalFilterFields]="['title','description','status']"
    [rows]="10"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} jobs"
  >
    <ng-template pTemplate="caption">
      <div class="flex align-items-center justify-content-between">
        <span class="p-input-icon-left">
          <i class="pi pi-search"></i>
          <input pInputText type="text" #globalFilter (input)="dt.filterGlobal($event.target.value, 'contains')" placeholder="Search jobs..." />
        </span>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="title">Title <p-sortIcon field="title"></p-sortIcon></th>
        <th pSortableColumn="description">Description <p-sortIcon field="description"></p-sortIcon></th>
        <th pSortableColumn="status">Status <p-sortIcon field="status"></p-sortIcon></th>
        <th>Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-job>
      <tr>
        <td>{{ job.title }}</td>
        <td>{{ job.description }}</td>
        <td>
          <p-tag [value]="job.status" severity="warn"></p-tag>
        </td>
        <td>
          <button pButton type="button" icon="pi pi-pencil" class="p-button-rounded p-button-text"></button>
          <button pButton type="button" icon="pi pi-trash" class="p-button-rounded p-button-text p-button-danger"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

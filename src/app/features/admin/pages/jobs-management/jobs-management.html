<form>
  <h1>Publier une offre d'emploi</h1>
  <div>
    <div>
      <label for="">Intitulé du poste</label>
      <input type="text">
    </div>
    <div>
      <label for="">Tags</label>
      <input type="text">
    </div>
    <div>
      <label for="">Adresse mail pour postuler</label>
      <input type="text">
    </div>
    <div>
      <p>Salaire</p>
      <div>
        <div>
          <label for="">Salaire minimum</label>
          <input type="text">
        </div>
        <div>
          <label for="">Salaire maximum</label>
          <input type="text">
        </div>
      </div>
    </div>
    <div>
      <p>Informations avancées</p>
      <div>
        <div>
          <label for="">Éducation</label>
          <input type="text">
        </div>
        <div>
          <label for="">Expérience</label>
          <input type="text">
        </div>
        <div>
          <label for="">Type de poste</label>
          <input type="text">
        </div>
        <div>
          <label for="">Postes disponibles</label>
          <input type="text">
        </div>
        <div>
          <label for="">Date d'expiration</label>
          <input type="text">
        </div>
        <div>
          <label for="">Niveau du poste</label>
          <input type="text">
        </div>
      </div>
      <div>
        <label for="">Lieu</label>
        <input type="text">
      </div>
    </div>
    <div>
      <p>Description et responsabilités</p>
      <div>
        <label for="">Description</label>
        <textarea name="" id="" placeholder="Ajoutez votre description de poste..."></textarea>
      </div>
      <div>
        <label for="">Responsabilités</label>
        <textarea name="" id="" placeholder="Ajoutez vos responsabilités de poste..."></textarea>
      </div>
    </div>
  </div>
  <button class="px-6 py-2 rounded bg-primary">Publier l'offre d'emploi</button>
</form>

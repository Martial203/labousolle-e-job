<div class="jobs-management-container">
  <div class="flex flex-row justify-between header">
    <h1 class="text-xl font-semibold">Mes emplois (599)</h1>
    <button pButton type="button" routerLink="/admin/jobs/new" label="Add Job" icon="pi pi-plus" class="p-button-success" severity="info"></button>
  </div>

  <p-table
    *ngIf="jobs$|async as jobs"
    #dt
    [value]="mapToJobRow(jobs)"
    [paginator]="true"
    [rows]="10"
    [tableStyle]="{ 'min-width': '50rem' }"
    [globalFilterFields]="['title','description','status']"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} jobs"
  >
    <ng-template pTemplate="caption">
      <div class="flex items-center justify-end">
        <p-iconField class="p-input-icon-left">
          <p-inputIcon class="pi pi-search"></p-inputIcon>
          <input pInputText type="text" #globalFilter (input)="dt.filterGlobal($event.target.value, 'contains')" placeholder="Search jobs..." />
        </p-iconField>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="title">Emplois <p-sortIcon field="title"></p-sortIcon></th>
        <th pSortableColumn="status">Status <p-sortIcon field="status"></p-sortIcon></th>
        <th pSortableColumn="description">Candidatures <p-sortIcon field="description"></p-sortIcon></th>
        <th>Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-job>
      <tr>
        <td>
          <h2 class="mb-1 font-semibold">{{ job.title }}</h2>
          <p class="text-xs text-gray">Temps plein * 27 jours restants</p>
        </td>
        <td class="{{ job.status === 'Active' ? 'text-green-500' : 'text-red-500' }}"><i class="mr-0.5 pi {{ job.status==='Active' ? 'pi-check-circle' : 'pi-times-circle' }}"></i> {{ job.status }}</td>
        <td><i class="pi pi-users"></i> 100 candidatures</td>
        <td>
          <button pButton icon="pi pi-ellipsis-v" (click)="menu.toggle($event)" class="p-button-rounded p-button-text"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>
  
  <p-tieredMenu #menu [model]="items" [popup]="true" />


</div>

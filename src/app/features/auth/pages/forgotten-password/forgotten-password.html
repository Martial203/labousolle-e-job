<div class="flex min-h-screen">
  <!-- Left Panel -->
  <div class="flex items-center justify-center hidden w-full p-8 text-white lg:w-5/12 bg-primary md:flex">
    <div>
      <h1 class="mb-8 text-4xl font-bold lg:text-5xl">Pas de panique !</h1>
      <p class="text-lg lg:text-xl opacity-90">Nous sommes là</p>
    </div>
  </div>
  
  <!-- Right Panel -->
  <div class="flex items-center justify-center w-full p-8 bg-white lg:w-7/12">
    <div class="flex flex-col w-full max-w-md gap-8">
      <ng-container *ngIf="emailSent!=null; else form">
        <div class="mb-6">
          <h2 class="mb-6 text-2xl font-bold">Vérifiez votre e-mail</h2>
          <p>Merci, consultez vos e-mails pour obtenir le code de réinitialisation de votre mot de passe.</p>
        </div>
        
        <!-- OTP Input Field -->
        <form class="flex flex-col gap-2 mb-8">
          <p-inputOtp #otp="ngModel" class="mb-4" ngModel name="otp" [length]="6" [disabled]="processState===PROCESS_STATES.LOADING" required></p-inputOtp>

          <p-message *ngIf="processState===PROCESS_STATES.SUCCESS" severity="success" text="Code vérifié avec succès !" class="block w-full mb-4"></p-message>
          <p-message *ngIf="processState===PROCESS_STATES.ERROR" severity="error" [text]="error" class="block w-full mb-4"></p-message>

          <button pButton type="submit" severity="info" class="mt-4 font-semibold" [disabled]="otp.value.length<6 || processState===PROCESS_STATES.LOADING" [loading]="processState===PROCESS_STATES.LOADING" [loading]="processState===PROCESS_STATES.LOADING" (click)="onOtpSubmit(otp.value)">Vérifier</button>
        </form>
        
        <div class="flex flex-row gap-4">
          <p class="text-xs text-gray-700">
        Je n'ai pas reçu de mail ? 
        <a routerLink="./" class="font-semibold text-primary hover:underline">
          Renvoyer
        </a>
          </p>
          <p class="text-xs text-gray-700">
        Je me suis trompé d'adresse mail ? 
        <a routerLink="./" (click)="modifyEmail()" class="font-semibold text-primary hover:underline">
          Modifier
        </a>
          </p>
        </div>
      </ng-container>
      <ng-template #form>
        <h2 class="mb-8 text-2xl font-semibold">Mot de passe oublié</h2>
        
        <form class="flex flex-col gap-12" #emailForm="ngForm" (ngSubmit)="onInitPasswordReset(email.value)">
          
          <!-- Email Field -->
          <p-floatlabel variant="on">
            <input type="email" id="email" name="email" pInputText [invalid]="email.invalid && email.touched" placeholder="johndoe@exemple.com" autocomplete="email" ngModel #email="ngModel" class="w-full" required email>
            <label for="email" class="mb-2 text-sm font-medium text-gray-700 ">Email</label>
          </p-floatlabel>
          
          <div class="flex flex-col gap-4">
            <!-- Submit Button -->
            <button pButton type="submit" severity="info" class="font-semibold" [disabled]="emailForm.invalid || processState===PROCESS_STATES.LOADING" [loading]="processState===PROCESS_STATES.LOADING" [loading]="processState===PROCESS_STATES.LOADING">Continuer</button>
            <button pButton type="button" severity="secondary">Retour</button>
          </div>
          
          <!-- Sign Up Link -->
          <div class="mt-6 text-center">
            <span class="text-sm text-gray-600">Nouveau ? </span>
            <a routerLink="/auth/sign-up" class="text-sm font-medium text-primary hover:underline">
              SIGN UP here 
            </a>
          </div>
        </form>
      </ng-template>
    </div>
  </div>
</div>

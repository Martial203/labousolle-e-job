<div class="flex min-h-screen">
  <!-- Left Panel -->
  <div class="flex items-center justify-center w-full p-8 text-white lg:w-5/12 bg-primary">
    <div>
      <h1 class="mb-8 text-4xl font-bold lg:text-5xl">Pas de panique !</h1>
      <p class="text-lg lg:text-xl opacity-90">Nous sommes là</p>
    </div>
  </div>
  
  <!-- Right Panel -->
  <div class="flex items-center justify-center w-full p-8 bg-white lg:w-7/12">
    <div class="flex flex-col w-full max-w-md gap-8">
      <h2 class="mb-8 text-2xl font-semibold">Mot de passe oublié</h2>
      
      <form class="flex flex-col gap-12" #loginForm="ngForm">
        
        <!-- Email Field -->
        <div class="mb-5">
          <label for="email" class="block mb-2 text-sm font-medium text-gray-700">Email</label>
          <input pInputText type="email" id="email" name="email" class="w-full" placeholder="johndoe@exemple.com" required>
        </div>
        
        <div class="flex flex-col gap-4">
          <!-- Submit Button -->
          <button pButton type="submit" severity="info" class="font-semibold">Continuer</button>
          <button pButton type="submit" severity="secondary">Retour</button>
        </div>
        
        <!-- Sign Up Link -->
        <div class="mt-6 text-center">
          <span class="text-sm text-gray-600">Nouveau ? </span>
          <a routerLink="/auth/sign-up" class="text-sm font-medium text-primary hover:underline">
            SIGN UP here
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

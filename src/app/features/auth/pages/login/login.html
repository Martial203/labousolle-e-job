<div class="flex min-h-screen">
  <!-- Left Panel -->
  <div class="flex items-center justify-center w-full p-8 text-white lg:w-5/12 bg-primary">
    <div class="text-center">
      <h1 class="mb-4 text-4xl font-bold lg:text-5xl">hao ! tu es là</h1>
      <p class="text-lg lg:text-xl opacity-90">Nous sommes ravis de te revoir</p>
    </div>
  </div>
  
  <!-- Right Panel -->
  <div class="flex items-center justify-center w-full p-8 bg-white lg:w-7/12">
    <div class="w-full max-w-md">
      <h2 class="mb-8 text-2xl font-semibold text-gray-800">Connecte-toi</h2>
      
      <form (ngSubmit)="onSubmit(loginForm.value)" #loginForm="ngForm" class="flex flex-col gap-5">
        <!-- Email Field -->
        <p-floatlabel variant="on">
          <input type="email" id="email" name="email" pInputText [invalid]="email.invalid && email.touched" placeholder="johndoe@exemple.com" autocomplete="email" ngModel #email="ngModel" class="w-full" required email>
          <label for="email" class="mb-2 text-sm font-medium text-gray-700 ">Email</label>
        </p-floatlabel>
        
        <!-- Password Field -->
        <p-floatlabel variant="on">
          <p-password id="password" inputStyleClass="w-full" class="block w-full" name="password" autocomplete="password" placeholder="••••••••••••••" [toggleMask]="true" [feedback]="false" ngModel required></p-password>
          <label for="password" class="text-sm font-medium text-gray-700">Password</label>
        </p-floatlabel>
        
        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between mb-6">
          <div class="flex items-center gap-2">
            <p-checkbox type="checkbox" id="remember" name="remember" [binary]="true" class="w-4 h-4 border-gray-300 rounded cursor-pointer text-primary focus:ring-primary"></p-checkbox>
            <label for="remember" class="text-sm text-gray-700 cursor-pointer select-none whitespace-nowrap">
              Me rappeler mes identifiants
            </label>
          </div>
          <a routerLink="/auth/forgotten-password" class="text-sm transition-colors text-primary hover:text-primary hover:underline">
            Mot de passe oublié?
          </a>
        </div>
        
        <!-- Submit Button -->
        <button type="submit" pButton severity="info" [disabled]="loginForm.invalid || processState===PROCESS_STATES.LOADING" class="w-full" [loading]="processState===PROCESS_STATES.LOADING">Se connecter</button>
        
        <!-- Sign Up Link -->
        <div class="mt-6 text-center">
          <span class="text-sm text-gray-600">NOUVEAU ? </span>
          <a routerLink="/auth/sign-up" class="text-sm font-medium text-blue-600 transition-colors hover:text-blue-800 hover:underline">
            S'INSCRIRE ICI
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="flex min-h-screen">
  <!-- Left Panel -->
  <div class="flex items-center justify-center w-full p-8 text-white lg:w-5/12 bg-primary">
    <div class="text-center">
      <h1 class="mb-4 text-4xl font-bold lg:text-5xl">hao ! tu es là</h1>
      <p class="text-lg lg:text-xl opacity-90">Nous sommes ravis de te revoir</p>
    </div>
  </div>
  
  <!-- Right Panel -->
  <div class="flex items-center justify-center w-full p-8 bg-white lg:w-7/12">
    <div *ngIf="success; else form" class="flex flex-col gap-4 text-center">
      <img class="w-24 mx-auto" src="/assets/images/success-icon.svg" alt="success">
      <h2 class="text-2xl font-semibold text-primary">Félicitations</h2>
      <p>Ton mot de passe a été changé avec succès.</p>
    </div>

    <ng-template #form>
      <div class="w-full max-w-md">
        <h2 class="mb-12 text-2xl font-semibold text-gray-800">Crees un nouveau mot de passe</h2>
        
        <form (ngSubmit)="onSubmit(newPasswordForm.value)" #newPasswordForm="ngForm" class="flex flex-col gap-6">
          <!-- Email Field -->
          <p-floatlabel variant="on">
            <p-password id="password" inputStyleClass="w-full" class="block w-full" name="password" autocomplete="password" placeholder="••••••••••••••" [toggleMask]="true" [feedback]="false" ngModel required></p-password>
            <label for="password" class="text-sm font-medium text-gray-700">Mot de passe</label>
          </p-floatlabel>
          
          <!-- Password Field -->
          <p-floatlabel variant="on">
            <p-password id="confirmPassword" inputStyleClass="w-full" class="block w-full" name="confirmPassword" autocomplete="confirmPassword" placeholder="••••••••••••••" [toggleMask]="true" [feedback]="false" ngModel required></p-password>
            <label for="confirmPassword" class="text-sm font-medium text-gray-700">Confirmation de mot de passe</label>
          </p-floatlabel>
        
          
          <!-- Submit Button -->
          <button type="submit" pButton severity="info" [disabled]="newPasswordForm.invalid" class="w-full mt-6">Valider</button>
        </form>
      </div>
    </ng-template>
  </div>
</div>
